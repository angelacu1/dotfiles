
# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 100000
# Enable mouse control
set-option -g -q mouse on

# ---- Copy mode -------------------------------------------------------------
# Use vi keys when navigating/selecting in copy mode
set-window-option -g mode-keys vi

# Let tmux own the system clipboard (helps ssh / OSC-52 too)
set -g set-clipboard on


# Set your system clipboard command (choose one for your OS)
# For Linux (X11):
set -s copy-command 'xclip -in -selection clipboard'
# For Linux (Wayland):
# set -s copy-command 'wl-copy'
# For macOS:
# set -s copy-command 'pbcopy'

# Automatically copy on mouse release
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
# ---------------------------------------------------------------------------
